---
# Publishes a release when a tag matching the galaxy.yml version is pushed.
# Publishing to Ansible Galaxy waits for approval in the "release" environment,
# which holds the GALAXY_API_KEY secret.
name: Release

'on':
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Never cancel a release that is already in progress.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install ansible-core
        run: python -m pip install ansible-core

      - name: Check that the tag matches the release metadata
        env:
          TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          import sys

          import yaml

          tag = os.environ["TAG"]
          with open("galaxy.yml", encoding="utf-8") as f:
              version = str(yaml.safe_load(f)["version"])
          with open("changelogs/changelog.yaml", encoding="utf-8") as f:
              releases = yaml.safe_load(f).get("releases") or {}

          if tag != version:
              sys.exit(f"Tag {tag} does not match version {version} in galaxy.yml.")
          if version not in releases:
              sys.exit(f"changelogs/changelog.yaml has no entry for {version}. Run antsibull-changelog release.")
          print(f"Releasing {version}.")

      - name: Build the collection
        run: ansible-galaxy collection build --output-path build/

      - name: Upload the collection artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/*.tar.gz
          if-no-files-found: error

  publish-galaxy:
    name: Publish to Ansible Galaxy
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install ansible-core
        run: python -m pip install ansible-core

      - name: Download the collection artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/

      - name: Publish the collection
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy collection publish build/*.tar.gz --api-key "${GALAXY_API_KEY}"

  github-release:
    name: Create GitHub release
    needs: publish-galaxy
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the GitHub release.
    steps:
      - name: Download the collection artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          gh release create "${TAG}" build/*.tar.gz \
            --title "${TAG}" \
            --notes "See [CHANGELOG.md](${SERVER_URL}/${GH_REPO}/blob/${TAG}/CHANGELOG.md) for all changes."
